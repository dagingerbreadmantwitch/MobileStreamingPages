<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Media Remote Control - MobileStream Studio</title>
  <meta name="description" content="Dedicated static remote trigger for launching Rive animations and WebM video overlays remotely over WebSockets and WebRTC.">
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body {
      padding-bottom: 3rem;
      touch-action: manipulation;
    }

    .remote-header {
      padding: 1.2rem 1rem;
      background: rgba(8, 12, 20, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-glass);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .room-badge-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass-bright);
      border-radius: var(--radius-lg);
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .touch-media-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 1.8rem 1.2rem;
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: var(--transition-bounce);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: var(--shadow-sm);
    }

    .touch-media-btn:active {
      transform: scale(0.95);
      background: var(--border-glass-bright);
    }

    .touch-media-btn .icon {
      font-size: 2.8rem;
    }

    .btn-rive {
      border-color: rgba(99, 102, 241, 0.5);
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
    }

    .btn-rive:hover {
      box-shadow: 0 0 25px var(--primary-glow);
    }

    .btn-video1 {
      border-color: rgba(6, 182, 212, 0.5);
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.15) 0%, rgba(59, 130, 246, 0.15) 100%);
    }

    .btn-video2 {
      border-color: rgba(236, 72, 153, 0.5);
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.15) 0%, rgba(244, 63, 94, 0.15) 100%);
    }

    .btn-stop {
      border-color: rgba(239, 68, 68, 0.5);
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      font-weight: 700;
    }

    .status-online {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .status-syncing {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
  </style>
</head>
<body>

  <!-- Top Controller Header -->
  <header class="remote-header">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; padding: 0;">
      <div style="display: flex; align-items: center; gap: 0.6rem;">
        <span style="font-size: 1.5rem;">🎬</span>
        <div>
          <h2 style="font-size: 1.1rem; margin: 0;">Rive & WebM Media Remote</h2>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Landscape OBS Overlay Controller</div>
        </div>
      </div>

      <div class="status-indicator status-online" id="connectionStatus">
        <span class="pulse-dot" style="background: #34d399; box-shadow: 0 0 8px #34d399;"></span>
        <span id="statusText">LOCAL SYNC</span>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 1.5rem;">
    <!-- Room Code Pairing Card -->
    <div class="room-badge-card">
      <div>
        <div style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); font-weight: 600;">STREAM ROOM ID</div>
        <div style="font-size: 1.6rem; font-weight: 900; font-family: var(--font-mono); color: var(--accent-cyan);" id="displayRoomId">----</div>
      </div>

      <div style="display: flex; gap: 0.5rem;">
        <input type="text" id="inputRoomId" placeholder="ROOM ID" style="width: 90px; text-transform: uppercase; font-family: var(--font-mono); font-size: 0.9rem; padding: 0.4rem 0.6rem; border-radius: 8px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.5); color: #fff;">
        <button class="btn btn-primary" id="connectRoomBtn" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Pair Phone</button>
      </div>
    </div>

    <!-- Media Trigger Grid -->
    <div class="media-grid">
      
      <!-- Launch Rive Animation -->
      <button class="touch-media-btn btn-rive" id="btnLaunchRive">
        <span class="icon">🎨</span>
        <span>Launch Rive Animation</span>
        <span style="font-size: 0.75rem; opacity: 0.7; font-family: var(--font-mono);" id="riveLabel">assets/animation.riv</span>
      </button>

      <!-- Launch WebM Video #1 -->
      <button class="touch-media-btn btn-video1" id="btnLaunchVideo1">
        <span class="icon">🎬</span>
        <span>Play WebM Video #1</span>
        <span style="font-size: 0.75rem; opacity: 0.7; font-family: var(--font-mono);" id="video1Label">assets/video1.webm</span>
      </button>

      <!-- Launch WebM Video #2 -->
      <button class="touch-media-btn btn-video2" id="btnLaunchVideo2">
        <span class="icon">🎥</span>
        <span>Play WebM Video #2</span>
        <span style="font-size: 0.75rem; opacity: 0.7; font-family: var(--font-mono);" id="video2Label">assets/video2.webm</span>
      </button>

      <!-- Stop All Media -->
      <button class="touch-media-btn btn-stop" id="btnStopMedia">
        <span class="icon">⏹️</span>
        <span>Stop All Media</span>
        <span style="font-size: 0.75rem; opacity: 0.7; font-family: var(--font-mono);">Clear Active Overlays</span>
      </button>

    </div>

    <!-- Custom Media File Editor -->
    <div class="glass-card" style="margin-bottom: 2rem;">
      <h3>Custom Media Path Configuration</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.2rem;">
        Specify custom filenames or external URLs for your Rive and WebM video assets.
      </p>

      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label style="font-size: 0.8rem; font-weight: 600; color: var(--accent-cyan); display: block; margin-bottom: 0.3rem;">Rive Animation Path (.riv)</label>
          <input type="text" id="customRivePath" value="../assets/animation.riv" style="width: 100%; padding: 0.6rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.4); color: #fff; font-family: var(--font-mono); font-size: 0.85rem;">
        </div>

        <div>
          <label style="font-size: 0.8rem; font-weight: 600; color: var(--accent-cyan); display: block; margin-bottom: 0.3rem;">WebM Video #1 Path (.webm)</label>
          <input type="text" id="customVideo1Path" value="../assets/video1.webm" style="width: 100%; padding: 0.6rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.4); color: #fff; font-family: var(--font-mono); font-size: 0.85rem;">
        </div>

        <div>
          <label style="font-size: 0.8rem; font-weight: 600; color: var(--accent-cyan); display: block; margin-bottom: 0.3rem;">WebM Video #2 Path (.webm)</label>
          <input type="text" id="customVideo2Path" value="../assets/video2.webm" style="width: 100%; padding: 0.6rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.4); color: #fff; font-family: var(--font-mono); font-size: 0.85rem;">
        </div>
      </div>
    </div>
  </main>

  <script src="../scripts/remote-control.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const roomDisplay = document.getElementById('displayRoomId');
      const inputRoom = document.getElementById('inputRoomId');
      const connectBtn = document.getElementById('connectRoomBtn');
      const statusText = document.getElementById('statusText');
      const statusBox = document.getElementById('connectionStatus');

      let currentRoom = window.remoteEngine.roomId;
      roomDisplay.textContent = currentRoom;

      // Handle pairing via PeerJS
      connectBtn.addEventListener('click', () => {
        const targetRoom = inputRoom.value.trim().toUpperCase() || currentRoom;
        statusText.textContent = 'CONNECTING...';
        statusBox.className = 'status-indicator status-syncing';

        window.remoteEngine.initPeerSender(targetRoom, () => {
          statusText.textContent = 'REMOTE PAIRED';
          statusBox.className = 'status-indicator status-online';
          roomDisplay.textContent = targetRoom;
        }, (err) => {
          statusText.textContent = 'LOCAL SYNC ONLY';
          statusBox.className = 'status-indicator status-online';
        });
      });

      // Media Launch Actions
      document.getElementById('btnLaunchRive')?.addEventListener('click', () => {
        const src = document.getElementById('customRivePath').value.trim() || '../assets/animation.riv';
        window.remoteEngine.send('play_rive', { src });
      });

      document.getElementById('btnLaunchVideo1')?.addEventListener('click', () => {
        const src = document.getElementById('customVideo1Path').value.trim() || '../assets/video1.webm';
        window.remoteEngine.send('play_video1', { src });
      });

      document.getElementById('btnLaunchVideo2')?.addEventListener('click', () => {
        const src = document.getElementById('customVideo2Path').value.trim() || '../assets/video2.webm';
        window.remoteEngine.send('play_video2', { src });
      });

      document.getElementById('btnStopMedia')?.addEventListener('click', () => {
        window.remoteEngine.send('stop_media');
      });
    });
  </script>
</body>
</html>
